<text class="secondary" x="646.2" y="360.0" font-size="11.5" text-anchor="middle">market data</text>
<text class="muted" x="646.2" y="374.0" font-size="10" text-anchor="middle">n=3,623</text>
<style>@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar-0 { fill: #184f95; } :root:not([data-theme="light"]) .bar-1 { fill: #256abf; } :root:not([data-theme="light"]) .bar-2 { fill: #3987e5; } :root:not([data-theme="light"]) .bar-3 { fill: #6da7ec; }  }
[data-theme="dark"] .bar-0 { fill: #184f95; } [data-theme="dark"] .bar-1 { fill: #256abf; } [data-theme="dark"] .bar-2 { fill: #3987e5; } [data-theme="dark"] .bar-3 { fill: #6da7ec; } </style>
