<text class="muted" x="478.8" y="374.0" font-size="10" text-anchor="middle">n=3,691</text>
<rect class="bar-3" x="602.7" y="289.2" width="87.1" height="36.8" rx="4" fill="#104281"><title>+ Binary (SBE, L1) market data: 15,743 ns p50 (n=3,623)</title></rect>
<text class="ink" x="646.2" y="279.2" font-size="13.5" font-weight="600" text-anchor="middle">15.7&#956;s</text>
