<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Tick-to-trade p50 dropped from 102.4 microseconds to 15.7 microseconds across three optimizations">

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .bg { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; }
    .secondary { fill: #52514e; }
    .muted { fill: #898781; }
    .grid { stroke: #e1e0d9; }
    .baseline { stroke: #c3c2b7; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .bg { fill: #1a1a19; }
      :root:not([data-theme="light"]) .ink { fill: #ffffff; }
      :root:not([data-theme="light"]) .secondary { fill: #c3c2b7; }
      :root:not([data-theme="light"]) .grid { stroke: #2c2c2a; }
      :root:not([data-theme="light"]) .baseline { stroke: #383835; }
    }
    [data-theme="dark"] .bg { fill: #1a1a19; }
    [data-theme="dark"] .ink { fill: #ffffff; }
    [data-theme="dark"] .secondary { fill: #c3c2b7; }
    [data-theme="dark"] .grid { stroke: #2c2c2a; }
    [data-theme="dark"] .baseline { stroke: #383835; }
  </style>
<rect class="bg" x="0" y="0" width="760" height="400"/>
<text class="ink" x="60" y="26" font-size="16" font-weight="600">Tick-to-trade p50, by optimization</text>
<text class="secondary" x="60" y="46" font-size="12.5">Wire arrival &#8594; order bytes at write() &#8226; ~6.5x cumulative reduction</text>
<line class="grid" x1="60" y1="326.0" x2="730" y2="326.0" stroke-width="1"/>
<text class="muted" x="50" y="330.0" font-size="11" text-anchor="end">0</text>
<line class="grid" x1="60" y1="279.2" x2="730" y2="279.2" stroke-width="1"/>
<text class="muted" x="50" y="283.2" font-size="11" text-anchor="end">20</text>
<line class="grid" x1="60" y1="232.4" x2="730" y2="232.4" stroke-width="1"/>
<text class="muted" x="50" y="236.4" font-size="11" text-anchor="end">40</text>
<line class="grid" x1="60" y1="185.6" x2="730" y2="185.6" stroke-width="1"/>
<text class="muted" x="50" y="189.6" font-size="11" text-anchor="end">60</text>
<line class="grid" x1="60" y1="138.9" x2="730" y2="138.9" stroke-width="1"/>
<text class="muted" x="50" y="142.9" font-size="11" text-anchor="end">80</text>
<line class="grid" x1="60" y1="92.1" x2="730" y2="92.1" stroke-width="1"/>
<text class="muted" x="50" y="96.1" font-size="11" text-anchor="end">100</text>
<text class="muted" x="730" y="54" font-size="11" text-anchor="end">&#956;s</text>
<line class="baseline" x1="60" y1="326" x2="730" y2="326" stroke-width="1.5"/>
<rect class="bar-0" x="100.2" y="86.5" width="87.1" height="239.5" rx="4" fill="#86b6ef"><title>Baseline: 102,399 ns p50 (n=84)</title></rect>
<text class="ink" x="143.8" y="76.5" font-size="13.5" font-weight="600" text-anchor="middle">102.4&#956;s</text>
<text class="secondary" x="143.8" y="346.0" font-size="11.5" text-anchor="middle">Baseline</text>
<text class="muted" x="143.8" y="360.0" font-size="10" text-anchor="middle">n=84</text>
<rect class="bar-1" x="267.7" y="170.3" width="87.1" height="155.7" rx="4" fill="#5598e7"><title>+ Batched bid/ask writes: 66,559 ns p50 (n=179)</title></rect>
<text class="ink" x="311.2" y="160.3" font-size="13.5" font-weight="600" text-anchor="middle">66.6&#956;s</text>
<text class="secondary" x="311.2" y="346.0" font-size="11.5" text-anchor="middle">+ Batched</text>
<text class="secondary" x="311.2" y="360.0" font-size="11.5" text-anchor="middle">bid/ask writes</text>
<text class="muted" x="311.2" y="374.0" font-size="10" text-anchor="middle">n=179</text>
<rect class="bar-2" x="435.2" y="285.9" width="87.1" height="40.1" rx="4" fill="#256abf"><title>+ Busy-spin &amp; QoS: 17,151 ns p50 (n=3,691)</title></rect>
<text class="ink" x="478.8" y="275.9" font-size="13.5" font-weight="600" text-anchor="middle">17.2&#956;s</text>
